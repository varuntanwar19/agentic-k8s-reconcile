apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autonomousagentpolicies.ai-sre.enterprise.ai
spec:
  group: ai-sre.enterprise.ai
  names:
    plural: autonomousagentpolicies
    singular: autonomousagentpolicy
    kind: AutonomousAgentPolicy
    shortNames:
      - aap
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                agentType:
                  type: string
                  enum:
                    - EventTrapper
                    - RCA
                    - Remediation
                autoRemediationEnabled:
                  type: boolean
                allowedActions:
                  type: array
                  items:
                    type: string
                maxConcurrency:
                  type: integer
                  minimum: 1
                  maximum: 20
            status:
              type: object
              properties:
                activeIncidents:
                  type: integer
                healthStatus:
                  type: string
                lastRemediationTimestamp:
                  type: string
