apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-sre-platform.fullname" . }}-event-trapper
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-sre-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-trapper-agent
spec:
  replicas: {{ .Values.agents.eventTrapper.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-sre-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: event-trapper-agent
  template:
    metadata:
      labels:
        {{- include "ai-sre-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: event-trapper-agent
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: event-trapper
          image: "{{ .Values.agents.eventTrapper.image.repository }}:{{ .Values.agents.eventTrapper.image.tag }}"
          imagePullPolicy: {{ .Values.agents.eventTrapper.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.agents.eventTrapper.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "ai-sre-platform.fullname" . }}-config
            - secretRef:
                name: {{ include "ai-sre-platform.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agents.eventTrapper.resources | nindent 12 }}
