 apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-sre-platform.fullname" . }}-mcp-prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-sre-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-prometheus
spec:
  replicas: {{ .Values.mcpServers.prometheus.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-sre-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-prometheus
  template:
    metadata:
      labels:
        {{- include "ai-sre-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-prometheus
    spec:
      containers:
        - name: mcp-prometheus
          image: "{{ .Values.mcpServers.prometheus.image.repository }}:{{ .Values.mcpServers.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServers.prometheus.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mcpServers.prometheus.port }}
              name: mcp
          env:
            - name: PROMETHEUS_ENDPOINT
              value: {{ .Values.mcpServers.prometheus.endpoint | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mcpServers.prometheus.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-sre-platform.fullname" . }}-mcp-k8s
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-sre-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-k8s
spec:
  replicas: {{ .Values.mcpServers.kubernetes.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-sre-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-k8s
  template:
    metadata:
      labels:
        {{- include "ai-sre-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-k8s
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: mcp-k8s
          image: "{{ .Values.mcpServers.kubernetes.image.repository }}:{{ .Values.mcpServers.kubernetes.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServers.kubernetes.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mcpServers.kubernetes.port }}
              name: mcp
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mcpServers.kubernetes.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-sre-platform.fullname" . }}-mcp-github
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-sre-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-github
spec:
  replicas: {{ .Values.mcpServers.github.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-sre-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-github
  template:
    metadata:
      labels:
        {{- include "ai-sre-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-github
    spec:
      containers:
        - name: mcp-github
          image: "{{ .Values.mcpServers.github.image.repository }}:{{ .Values.mcpServers.github.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServers.github.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mcpServers.github.port }}
              name: mcp
          envFrom:
            - secretRef:
                name: {{ include "ai-sre-platform.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mcpServers.github.resources | nindent 12 }}

