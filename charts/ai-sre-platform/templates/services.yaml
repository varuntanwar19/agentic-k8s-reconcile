apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-sre-platform.fullname" . }}-event-trapper
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-sre-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "ai-sre-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: event-trapper-agent
---
apiVersion: v1
