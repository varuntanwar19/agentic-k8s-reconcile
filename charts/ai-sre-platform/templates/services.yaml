spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    {{- include "ai-sre-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rca-agent
---
apiVersion: v1
