apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sre-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-sre-project
  source:
    repoURL: 'https://github.com/enterprise/ai-sre-platform.git'
    targetRevision: HEAD
    path: argocd
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true